version: "3"

vars:
  BUILD_DIR: ./build
  TARGET: "{{.BUILD_DIR}}/mink"

tasks:
  fmt:
    desc: "Format code"
    cmd: gofmt -w .

  lint:
    desc: "Run linter"
    cmd: golangci-lint run ./...

  lint:fix:
    desc: "Run linter with auto-fix"
    cmd: golangci-lint run --fix ./...

  build:
    desc: "Build binary to ./build/mink"
    cmd: go build -ldflags "-X github.com/nazarkhatsko/mink/cmd/version.Version=v1.0.0" -o {{.TARGET}} .

  clean:
    desc: "Remove build artifacts"
    cmd: rm -rf {{.BUILD_DIR}}

  run:
    desc: "Run a flow file (usage: task run -- <file>)"
    cmd: go run . run {{.CLI_ARGS}}
