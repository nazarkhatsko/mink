version: "1.0"
info:
  name: "User API E2E Test"
  description: "Full user lifecycle test"

vars:
  base_url: "https://httpbin.org"

instances:
  api:
    driver: http
    methods: [post]

  time:
    driver: time
    methods: [wait]

  gen:
    driver: generate
    methods: [object]

  check:
    driver: validate
    methods: [schema]

flows:
  - id: create_and_verify_user
    description: "Generate a fake user payload, POST it to httpbin, wait 200ms, validate the echoed response shape"
    actions:
      - id: generate_user
        description: "Generate random user payload"
        instance: gen
        method: object
        execute_with:
          schema:
            name:
              type: string
              value: faker.name
            email:
              type: string
              value: faker.email
            age:
              type: int
              value: faker.age

      - id: post_user
        description: "Post user payload to httpbin"
        instance: api
        method: post
        execute_with:
          url: "${vars['base_url'] + '/post'}"
          body: "${actions['generate_user']}"

      - id: wait
        description: "Wait a moment"
        instance: time
        method: wait
        execute_with:
          ms: 200

      - id: validate_response
        description: "Validate response has json field"
        instance: check
        method: schema
        execute_with:
          value: "${actions['post_user']['resp']['body']}"
          schema:
            type: object
            required: [json]
            properties:
              json:
                type: object
