version: "1.0"
info:
  name: "Simple API E2E Tests"
  description: "Full user lifecycle against simple-api (run: go run examples/simple-api/main.go)"

vars:
  base_url: "http://localhost:8080"
  api_key: "secret-api-key"

instances:
  api:
    driver: http

  gen:
    driver: generate

  check:
    driver: validate

flows:
  - id: unauthorized_request
    description: "Send a request without an API key, validate the 401 response"
    actions:
      - id: request_without_key
        description: "Request without API key should return 401"
        instance: api
        execute_with:
          method: GET
          url: "${vars['base_url'] + '/users'}"

      - id: validate_unauthorized
        description: "Validate 401 response"
        instance: check
        execute_with:
          value: "${actions['request_without_key']['resp']}"
          schema:
            type: object
            properties:
              status:
                type: integer
                const: 401

  - id: user_lifecycle
    description: "Generate a user, create it, fetch, list, delete, and confirm 404"
    actions:
      - id: generate_user
        description: "Generate random user payload"
        instance: gen
        execute_with:
          schema:
            name:
              type: string
              value: faker.name
            email:
              type: string
              value: faker.email
            age:
              type: int
              value: faker.age

      - id: create_user
        description: "Create a new user"
        instance: api
        execute_with:
          method: POST
          url: "${vars['base_url'] + '/users'}"
          headers:
            X-Api-Key: "${vars['api_key']}"
          body: "${actions['generate_user']}"
        mutate_on:
          done: |
            state["user_id"] = event["output"]["resp"]["body"]["data"]["id"]

      - id: validate_created
        description: "Validate create response shape"
        instance: check
        execute_with:
          value: "${actions['create_user']['resp']}"
          schema:
            type: object
            properties:
              status:
                type: integer
                const: 201
              body:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, name, email, age]

      - id: get_user
        description: "Fetch the created user by id"
        instance: api
        execute_with:
          method: GET
          url: "${vars['base_url'] + '/users/' + str(state['user_id'])}"
          headers:
            X-Api-Key: "${vars['api_key']}"

      - id: validate_get
        description: "Validate fetched user matches created"
        instance: check
        execute_with:
          value: "${actions['get_user']['resp']}"
          schema:
            type: object
            properties:
              status:
                type: integer
                const: 200
              body:
                type: object
                required: [data]

      - id: list_users
        description: "List all users"
        instance: api
        execute_with:
          method: GET
          url: "${vars['base_url'] + '/users'}"
          headers:
            X-Api-Key: "${vars['api_key']}"

      - id: validate_list
        description: "Validate list response has count"
        instance: check
        execute_with:
          value: "${actions['list_users']['resp']}"
          schema:
            type: object
            properties:
              status:
                type: integer
                const: 200
              body:
                type: object
                required: [data, count]
                properties:
                  count:
                    type: integer
                    minimum: 1

      - id: delete_user
        description: "Delete the created user"
        instance: api
        execute_with:
          method: DELETE
          url: "${vars['base_url'] + '/users/' + str(state['user_id'])}"
          headers:
            X-Api-Key: "${vars['api_key']}"

      - id: validate_deleted
        description: "Validate delete response"
        instance: check
        execute_with:
          value: "${actions['delete_user']['resp']}"
          schema:
            type: object
            properties:
              status:
                type: integer
                const: 200

      - id: get_deleted_user
        description: "Confirm user no longer exists"
        instance: api
        execute_with:
          method: GET
          url: "${vars['base_url'] + '/users/' + str(state['user_id'])}"
          headers:
            X-Api-Key: "${vars['api_key']}"

      - id: validate_not_found
        description: "Validate 404 for deleted user"
        instance: check
        execute_with:
          value: "${actions['get_deleted_user']['resp']}"
          schema:
            type: object
            properties:
              status:
                type: integer
                const: 404
