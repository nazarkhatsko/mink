version: "1.0"
info:
  name: "Error Handling Demo"
  description: "Each flow deliberately fails one action to show event['error']['code'] in mutate_on.fail"

instances:
  api:
    driver: http

  check:
    driver: validate

flows:
  - id: config_error
    description: "http action missing the required url option"
    actions:
      - id: missing_url
        description: "http driver called without the required url option"
        instance: api
        execute_with:
          method: GET
        mutate_on:
          fail: |
            state["code"]    = event["error"]["code"]
            state["message"] = event["error"]["message"]

  - id: transport_error
    description: "http request to 127.0.0.1:1 — nothing listens there, connection refused"
    actions:
      - id: connection_refused
        description: "nothing listens on port 1, so the TCP connect is refused immediately"
        instance: api
        execute_with:
          method: GET
          url: "http://127.0.0.1:1/"
        mutate_on:
          fail: |
            state["code"]    = event["error"]["code"]
            state["message"] = event["error"]["message"]

  - id: timeout_error
    description: "http request to the unroutable 10.255.255.1, with a 200ms action timeout"
    actions:
      - id: unroutable_host
        description: "10.255.255.1 is unroutable, so the 200ms action timeout fires first"
        instance: api
        timeout: 200
        execute_with:
          method: GET
          url: "http://10.255.255.1/"
        mutate_on:
          fail: |
            state["code"]    = event["error"]["code"]
            state["message"] = event["error"]["message"]

  - id: assertion_error
    description: "validate action whose value doesn't match its schema"
    actions:
      - id: schema_mismatch
        description: "value deliberately doesn't match the schema — this is what 'internal' means for validate: not a broken flow, a failed assertion"
        instance: check
        execute_with:
          value:
            status: "ok"
          schema:
            type: object
            required: ["missing_field"]
        mutate_on:
          fail: |
            state["code"]    = event["error"]["code"]
            state["message"] = event["error"]["message"]
            state["output"]  = event["output"]
